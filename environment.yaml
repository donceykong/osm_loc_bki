name: osmlocbki
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # C++ build
  - cxx-compiler
  - cmake>=3.25
  - ninja
  - eigen=3.4
  - yaml-cpp
  - nlohmann_json
  - zlib
  # osm_localization (third_party/osm_localization): GTSAM, and OpenCV without a GUI toolkit
  - gtsam=4.2
  - libopencv=4.13=headless*
  - libboost-headers
  - tbb-devel
  - pybind11
  - scikit-build-core
  # Python: OSM parsing, the live view
  - numpy
  - lxml
  - pyyaml
  - matplotlib
  - pyvista                # the 3D view (run.py --view 3d)
  - pip:
      - -e .   # builds the C++ core (CMake) and installs the osmlocbki package
