# OSM-BKI mapping (the paper's settings; the OSM strength is tuned per segmentation model).

map:
  resolution: 0.3        # voxel size, m
  block_depth: 2         # blocks of 2^(depth - 1) voxels a side; a block sees its 6 neighbours' points
  ell: 1.0               # sparse-kernel length scale, m
  sf2: 1.0               # kernel scale
  prior: 1.0             # Dirichlet pseudo-count per class of a fresh voxel
  adaptive_kernel: {enabled: true, a: 1.0, b: -3.0}   # length ell * a * exp(1 + b * vacuity)
  ds_resolution: 0.1     # scans are averaged over voxels this size before insertion
  max_range: 200.0       # m from the sensor
  backend: cpu           # where the voxels live: cpu, or nvblox (GPU, with nvblox's TSDF; run.py --mapper)

osm:
  strength: 0.1          # lambda: 0.1 for an in-domain model (lidarrv_mcd), ~2 under domain shift
  decay_m: 2.0           # support falls from 1 at a shape's edge to 0 this far outside it
  # P(class | OSM class). mcd_hand maps OSM buildings to building only; mcd_tuned (fitted on TUHH)
  # gives them 42% fence, which the boost turns into fences along walls at high strength (KTH day_09,
  # lidarrv_kitti360, strength 2: mIoU 0.393 with mcd_hand, 0.365 with mcd_tuned)
  confusion: osm_confusion/mcd_hand.yaml
  # band width (m) of OSM lines and points without a width tag; a tagged width wins, and major
  # roads take a per-highway default when converted (python/osmlocbki/osm.py)
  widths: {roads: 4.0, sidewalks: 2.0, cycleways: 2.0, fences: 0.6, trees: 10.0}

ground:                  # Patchwork++ verdicts gate OSM support (config/labels.yaml ground roles)
  enabled: true
  sensor_height: 1.73
  min_range: 0.0
  max_range: 200.0
  reflected_noise_removal: false

nvblox:                  # the nvblox backend: a TSDF of the same scans at the map's resolution
  azimuth: 512           # the LiDAR's range image (MCD: Ouster OS1-128, 512 columns)
  elevation: 128
  elevation_deg: [-22.5, 22.5]
  max_range: 60.0        # TSDF integration distance, m
  truncation_vox: 4.0
  every_keyframe: true   # the TSDF takes every localization keyframe's scan (1 m apart), not only the mapped ones
  nearest_max_dist_vox: 1.5        # how far off the nearest LiDAR ray a voxel may be integrated (nvblox: 0.5)
  interp_max_difference_vox: 2.0   # range jump between neighbouring pixels that stops interpolation
  free_space_mask: true  # report no semantic voxel where the TSDF sees free space (kernel smear, moved objects)
  free_distance: 0.45    # m: TSDF distance beyond which a voxel is free
  unified_memory: true   # blocks in CUDA unified memory: maps larger than the GPU page out to host RAM

survey:                  # an airborne survey (DSM/DEM) in the loop: run.py --surface FILE|auto
  weight: 0.1            # a survey voxel's evidence (times OSM's support), in LiDAR points: LiDAR wins
  radius: 50.0           # the survey is projected within this of each mapped pose
  ground_above_dem: 0.4  # survey points lower than this over the terrain model are ground
  z_offset: auto         # survey height -> map z: auto (from each scan's ground points) or metres
