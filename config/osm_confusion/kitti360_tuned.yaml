# Jointly optimized by joint_optimize.py on 7 sequences (2013_05_28_drive_0002_sync, 2013_05_28_drive_0003_sync, 2013_05_28_drive_0004_sync, 2013_05_28_drive_0005_sync, 2013_05_28_drive_0006_sync, 2013_05_28_drive_0007_sync, 2013_05_28_drive_0010_sync); objective = mean per-sequence conditional mIoU; row-stochastic.
# Data: every GT-labeled keyframe (5 m), OSM vectors from the mapper's OSMVisualizer with the per-side road/sidewalk offsetting (decay 0), per-point Patchwork++ ground state. Score 0.3948 mean conditional mIoU (previous matrix: 0.3873 on the same data).

