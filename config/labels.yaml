# The common taxonomy the semantic map is built in, and how each segmentation's raw label ids map
# onto it. Class 0 doubles as free space: it never receives evidence, and raw classes mapped to it
# (poles, people, signs, ...) deposit nothing.
#
#   ground  where the class may occur relative to the ground surface: ground | nonground | both.
#           OSM support for a class is dropped at points whose Patchwork++ verdict contradicts it.

classes:
  - {name: unlabeled,  color: [0, 0, 0],       ground: both}
  - {name: road,       color: [128, 64, 128],  ground: ground}
  - {name: sidewalk,   color: [232, 35, 244],  ground: ground}
  - {name: parking,    color: [160, 170, 250], ground: ground}
  - {name: building,   color: [255, 200, 0],   ground: nonground}
  - {name: fence,      color: [255, 120, 50],  ground: nonground}
  - {name: vegetation, color: [0, 175, 0],     ground: nonground}
  - {name: vehicle,    color: [100, 150, 245], ground: nonground}
  - {name: terrain,    color: [144, 238, 144], ground: ground}

# the label set of each segmentation model's outputs
models:
  lidarrv_mcd: mcd
  lidarrv_kitti360: kitti360
  cenet_kitti360: kitti360
  cenet_mcd: mcd              # CU-Multi north campus (its class scores)

# The localizer's building points, per label set: the ids that match OSM building outlines. A label
# set not listed here uses every id it maps to "building" (MCD's shelters and KITTI-360's walls, bridges
# and tunnels are buildings to the map but not OSM outlines: with them TUHH day_03 localizes ~40% worse).
localization_buildings:
  mcd: [2]
  kitti360: [11]

# raw label id -> common class; ids not listed map to 0
label_sets:
