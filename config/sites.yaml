# What mapping adds to osm_localization's sites (third_party/osm_localization/config/sites.yaml:
# where each site's sequences live, its georeference, pose / scan / label formats and OSM map).
# Any site there runs; an entry here is needed only for what it does not say, and serves every site
# whose name starts with its own (kitti360_gt serves kitti360_gt_0002):
#
#   label_set      the label set (config/labels.yaml) of the site's own labels (flat or scores); sites
#                  run with a segmentation model take the model's (config/labels.yaml models:)
#   lidar_to_body  {file, key}: lidar -> body extrinsic in a calibration yaml under the site's data_dir,
#                  when the poses are of the body and osm_localization does not list it (mapping levels
#                  the LiDAR's own scans: MCD's Ouster is mounted upside down)
#   lidar          {azimuth, elevation, elevation_deg: [lo, hi]}: the LiDAR's range image for the TSDF,
#                  when it is not the Ouster OS1-128 config/mapping.yaml (nvblox:) describes

kth:
  lidar_to_body: {file: hhs_calib.yaml, key: body.os_sensor.T}

kth_gt:
  label_set: mcd
  lidar_to_body: {file: hhs_calib.yaml, key: body.os_sensor.T}

tuhh:
  label_set: mcd
  lidar_to_body: {file: hhs_calib.yaml, key: body.os_sensor.T}

ntu:
  lidar_to_body: {file: atv_calib.yaml, key: body.os_sensor.T}

ntu_gt:
  label_set: mcd
  lidar_to_body: {file: atv_calib.yaml, key: body.os_sensor.T}

# CU-Multi: its own labels (only their building class is in config/labels.yaml so far); its Ouster
# (128 x 512) sees -15.5 .. 18 deg
cu_main_campus:
  label_set: cu_multi
  lidar: {azimuth: 512, elevation: 128, elevation_deg: [-15.5, 18.0]}

cu_kittredge_loop:
  label_set: cu_multi
  lidar: {azimuth: 512, elevation: 128, elevation_deg: [-15.5, 18.0]}

cu_north_campus:
  lidar: {azimuth: 512, elevation: 128, elevation_deg: [-15.5, 18.0]}

kitti360:
  lidar: {azimuth: 1024, elevation: 64, elevation_deg: [-24.9, 2.0]}   # Velodyne HDL-64E

kitti360_gt:
  label_set: kitti360
  lidar: {azimuth: 1024, elevation: 64, elevation_deg: [-24.9, 2.0]}
